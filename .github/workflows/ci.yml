name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARDCOST_MODEL: claude-sonnet-5-5  # must match the model the LLM cache was recorded with
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # replays evals/llm_cache.json, no API key needed; exits 1 if hybrid extraction accuracy < 0.9
      - run: uv run python evals/run_eval.py
