[project]
name = "cardcost"
version = "0.1.0"
description = "German credit-card cost advisor: whole-document extraction + deterministic Decimal math"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "anthropic>=2.3",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=1.2",
]

[project.optional-dependencies]
# Layout extractor for ingest only (ADR 0003); questions are answered from the fees file without it.
ingest = ["docling>=2.150"]

[project.scripts]
cardcost = "cardcost.cli:main"
cardcost-mcp = "cardcost.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "fpdf2>=2.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["cardcost"]
